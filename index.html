<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1025" />
    <meta name="description" content="ブラウザで遊べるオリジナルスロットシミュレーター Lucky Juggler" />
    <title>Lucky Juggler - オリジナルスロットシミュレーター</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d0714;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #2a1a3d 0%, #0d0714 70%);
        color: #f5c542;
        font-family: 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.15em;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash h1 {
        font-size: 1.6rem;
        margin: 0 0 0.5rem;
        text-shadow: 0 0 12px rgba(245, 197, 66, 0.7);
      }
      #splash p {
        font-size: 0.8rem;
        color: #cbb7e0;
        letter-spacing: 0.3em;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>LUCKY JUGGLER</h1>
      <p>NOW LOADING...</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
